[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "staticdeploy"
version = "0.1.0"
description = "A small static-site hosting control plane with atomic deploys."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
staticdeploy = "staticdeploy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

